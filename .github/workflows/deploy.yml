name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    runs-on: ubuntu-latest
    needs: checks
    # Only main deploys to production; a workflow_dispatch from another
    # branch still runs the checks above but stops here.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DATABASE_URL is a Worker secret (set once via `wrangler secret put`),
      # not a GitHub secret — deploys never touch it.
      # Pinned to a commit SHA: this job holds the account API token,
      # so a floating major tag would be a supply-chain risk.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The deploy step succeeding only means the upload worked — verify the
      # Worker actually serves, and can reach the database, before calling the
      # deploy green. Retries absorb propagation of the new version.
      - name: Verify deployment
        run: |
          curl -sf --retry 6 --retry-delay 5 --retry-all-errors --max-time 15 \
            https://tio.twz.app/health | grep -q '"status":"ok"'
          curl -sf --retry 6 --retry-delay 5 --retry-all-errors --max-time 15 \
            https://tio.twz.app/api/categories | grep -q '"status":"success"'
          echo "health and database checks passed"
