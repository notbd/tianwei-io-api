name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # the deploy script loads and reaches wrangler, without credentials
      - run: node scripts/deploy.ts check

  deploy:
    runs-on: ubuntu-latest
    needs: checks
    # Only main deploys to production; a workflow_dispatch from another
    # branch still runs the checks above but stops here.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    # Secrets go only to the steps that use them. wrangler is the repo's own
    # (pnpm exec), so no third-party action holds the Cloudflare token.
    # DATABASE_URL is a Worker secret (set once via `wrangler secret put`),
    # not a GitHub secret; deploys never touch it.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to a commit: the steps holding the Cloudflare token run the
      # pnpm it installs.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A re-run keeps its original GITHUB_SHA, so re-running an old run would
      # deploy old code over newer. Deploy only the head of main. A run that a
      # newer push overtakes while it waits fails here; the newer run deploys.
      - name: Refuse anything but the head of main
        run: |
          git fetch --depth=1 origin main
          if [ "$GITHUB_SHA" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::$GITHUB_SHA is not the head of main; run the workflow from the head of main (Actions > Run workflow), or revert instead"
            exit 1
          fi

      # Saves the live version, deploys, then verifies the new one: /health
      # must report this commit, and the list, the categories and one post
      # must read.
      - name: Deploy and verify
        run: node scripts/deploy.ts release ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Puts the saved version back if a different one is live; a no-op when
      # nothing was deployed. The job stays red either way.
      - name: Restore the previous version
        if: failure() || cancelled()
        run: node scripts/deploy.ts restore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
